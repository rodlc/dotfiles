# Starship prompt configuration
# Docs: https://starship.rs/config/

# Format string
format = """
$username\
$character\
$directory\
$git_branch\
$git_status"""

right_format = """$ruby$nodejs$python$bun$golang"""

# Timeout for starship
scan_timeout = 10

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[username]
style_user = "cyan"
style_root = "red bold"
format = "[\\$$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "cyan bold"
disabled = false

[directory]
truncation_length = 1
truncate_to_repo = false
format = "[$path]($style) "
style = "cyan"

[git_branch]
symbol = ""
format = "[\\($branch\\)]($style)"
style = "purple bold"

[git_status]
disabled = true

# Language versions (contextual)
[ruby]
format = "[\\[💎 $version\\]]($style) "
style = "red"
detect_extensions = []
detect_files = ["Gemfile", ".ruby-version"]
detect_folders = []

[nodejs]
format = "[\\[📦 $version\\]]($style) "
style = "green"
detect_extensions = []
detect_files = ["package.json", ".nvmrc"]
detect_folders = []

[python]
format = "[\\[🐍 $version\\]]($style) "
style = "yellow"
detect_extensions = []
detect_files = ["requirements.txt", "pyproject.toml", ".python-version"]
detect_folders = []

[bun]
format = "[\\[🥟 $version\\]]($style) "
style = "yellow"
detect_extensions = []
detect_files = ["bun.lockb", "bunfig.toml"]
detect_folders = []

[golang]
format = "[\\[🐹 $version\\]]($style) "
style = "cyan"
detect_extensions = []
detect_files = ["go.mod", "go.sum"]
detect_folders = []
